name: groupr

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - env/postgres.env
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        IS_SIDEKIQ: false
        RAILS_ENV: ${RAILS_ENV}
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    command: bash -c "bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./backend:/app
      - /app/tmp/pids
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - env/rails.env

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        IS_SIDEKIQ: true
        RAILS_ENV: ${RAILS_ENV}
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    command: ["/bin/bash", "/app/sidekiq.sh"]
    volumes:
      - ./backend:/app
      - /app/tmp/pids
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    env_file:
      - env/rails.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    env_file:
      - env/react.env

volumes:
  postgres_data: 