# Categorization + audit rules for scripts/main/categorize-and-audit.js
#
# Category slug inference — ORDER MATTERS within a bucket, AND order between
# buckets matters (first match wins across the whole list). When adding new
# rules, put more-specific keywords ABOVE more-generic ones (e.g. "Apple Cider"
# → beverages must be listed before "Apple" → produce, otherwise apple cider
# lands in produce).
#
# Keywords are case-insensitive substrings matched against `name_en`. They are
# NOT regexes — to be safe, keep them as plain words/phrases.
#
# Brand matching is a separate, optional override. A brand on this list wins
# over any keyword rule.
category_rules:
  # Fluid/liquid rules listed BEFORE produce so that "Apple Juice", "Apple
  # Cider" don't get pulled into produce by the "Apple" keyword.
  beverages:
    keywords:
      - Apple Juice
      - Apple Cider
      - Orange Juice
      - Lemonade
      - Iced Tea
      - Sparkling Water
      - Seltzer
      - Coconut Water
      # "Soda" alone is too permissive — it hits "Baking Soda" in pantry
      # items. Use more specific phrases and rely on brand/cola keywords.
      - Soda Pop
      - Club Soda
      - Cream Soda
      - Soft Drink
      - Cola
      - Juice
      - Punch
      - Coffee
      - Espresso
      - Tea Bag
      - Green Tea
      - Black Tea
      - Water Bottle
