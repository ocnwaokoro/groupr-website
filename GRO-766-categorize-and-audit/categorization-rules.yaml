# Category overrides — applied AFTER category_rules, to EVERY product
# (including those that already have category_slug from reconcile.js).
#
# The upstream reconcile.js assigns some categories from Instacart
# `department` metadata; those assignments disagree with our desired taxonomy
# in enough cases that we need an explicit override pass here. For example:
#   - "Applegate Chicken & Sage Breakfast Sausage" (reconcile → cereal-snacks)
#     should be meat-seafood.
#   - "Haagen-Dazs Vanilla Ice Cream" (reconcile → pantry-staples) should be
#     dairy-eggs (but is typically also audit-excluded as frozen_dessert).
#   - "Jif Creamy Peanut Butter" (reconcile → cereal-snacks) should be
#     pantry-staples.
#   - "Sara Lee Dutch Apple Pie" (reconcile → pantry-staples) should be
#     bread-bakery.
#   - "Cotton Candy Grapes" (reconcile → cereal-snacks via "Candy" keyword)
#     should be produce.
#
# Each override entry may list:
#   slug:       required — target category slug
#   brands:     optional — lowercase exact-match brand strings
#   keywords:   optional — case-insensitive, word-boundary phrase match
#               against name_en (same matcher as category_rules)
#   overrides:  optional — phrases that, if present in name_en, DISABLE this
#               override for that product (e.g. "Pot Pie" disables the
#               "Pie → bread-bakery" override so savory pot pies stay in
#               pantry-staples)
#
# First matching entry wins. An item matched by an override has its
# category_source re-stamped as "override" so it's distinguishable from a
# fresh inference.
category_overrides:
  # Breakfast sausage brands and generic breakfast-sausage SKUs are meat, not
  # cereal-snack — even though the reconcile heuristic lumped them into
  # "breakfast" which mapped to cereal-snacks.
  - slug: meat-seafood
    brands:
      - applegate
    keywords:
      - Breakfast Sausage
      - Sausage Links
      - Sausage Patties
      - Brown 'N Serve Sausage
      - Brown'N Serve Sausage

  # Bakery items that reconcile dropped into pantry-staples or cereal-snacks
  # because of generic "Cake"/"Pie"/"Muffin" usage upstream. Keep the override
  # list specific to true bakery goods — Pot Pies, Pie Filling, Pie Crust,
  # Pumpkin Pie Spice, Ice Cream Cake, Cake Mix, Cake Flour are NOT bakery.
  - slug: bread-bakery
    overrides:
      - Pot Pie
      - Pie Filling
      - Pie Crust
      - Pumpkin Pie Spice
      - Pie Spice
      - Pudding & Pie
      - Ice Cream Cake
      - Ice Cream Cake Cup
      - Cake Mix
      - Cake Mate
      - Cake Flour
      - Cake Batter
      - Cake Cone
      - Cupcake Liner
      - Frozen Dessert
      - Pie Ice Cream
      - Chicken Pot Pie
      - Turkey Pot Pie
      - Beef Pot Pie
    brands:
      - muffin town
      - uncle wally's
      - entenmann's
      - sara lee
      - table talk
      - mrs. smith's
      - pepperidge farm
      - zaro's family bakery
      - zaros family bakery
      - zaro's
      - leonard novelty bakery
      - palermo's primo thin
      - kimberley's bakeshoppe
      - café valley bakery
      - cafe valley bakery
      - old fashioned
    keywords:
