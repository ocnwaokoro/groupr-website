# Audit exclusions — applied AFTER categorization. An excluded product keeps its
# slug (so reports can still show where it WOULD have landed) but receives
# audit_action: "exclude" and an audit_reason label so the final import step
# drops it.
#
# Keywords are case-insensitive substrings matched against `name_en`. The FIRST
# matching label wins (order matters for reporting, not for correctness — a
# product with multiple matches gets labelled by the first one in the list).
audit:
  exclude_patterns:
    - label: alcohol
      # If name_en matches ANY of these override phrases, the alcohol rule is
      # skipped for that product. This keeps clearly-non-alcoholic products
      # (Malta soda, non-alcoholic beer, vodka-pasta-sauce, beer-battered
      # onion rings, bourbon-flavored frozen dinners) out of the exclusion
      # pile. Overrides are matched as word-boundary, case-insensitive
      # substrings.
      overrides:
        - Non-Alcoholic
        - Non Alcoholic
        - Alcohol Free
        - Alcohol-Free
        - "0.0"
        # Vodka-as-flavoring (pasta sauces, etc.)
        - Vodka Sauce
        - Vodka Cream
        - Vodka Pasta
        - Vodka Arrabbiata
        - Alla Vodka
        - Sauce, Vodka
        # Bourbon-as-flavoring
        - Bourbon Chicken
        - Bourbon Glaze
        - Bourbon BBQ
        - Bourbon Hot Sauce
        - Bourbon Maple
        - Honey Bourbon
        - Whiskey Maple
        - Whiskey BBQ
        - Whiskey Glaze
        # Cooking uses
        - Beer Battered
        - Beer-Battered
        - Cooking Wine
        - Wine Vinegar
        - Wine Vinaigrette
        - Champagne Vinegar
        - Champagne Style
        - Champagne Vinaigrette
        - "Vinegar, Red Wine"
        - "Vinegar, White Wine"
        - Whiskey Flavored
        - Whiskey Flavor
        - Whiskey Seasoning
        # Non-alcoholic malt drinks (Malta soda, chocolate malt)
        - Malta Goya
        - Goya Malta
        - Chocolate Malt
        - Malted Milk
        # Flavor extracts
        - Rum Extract
        - Rum Flavor
        - Almond Extract
        # Marinades, mixers (non-alcoholic)
        - Margarita Mix
        - Mojito Mix
        - Mojito Lime Marinade
        - Mojito Marinade
        - Daiquiri Mix
        - Cocktail Sauce
        - Sauce, Margarita
        - Mixer, Strawberry Daiquiri
        - "Daiquiri/Margarita"
      keywords:
        # Only list phrases that unambiguously imply alcohol. Plain "Beer",
        # "Ale", "Cocktail" are intentionally NOT here because they produce
        # false positives against "Root Beer", "Ginger Ale", "Fruit Cocktail",
        # "Juice Cocktail", etc. Likewise "Gin" (gingerbread), "Scotch" (tape),
        # "Rum" (cake) are too risky; rely on brand matches for those.
        - Hard Cider
        - Hard Seltzer
        - Hard Lemonade
        - Malt Beverage
        - Craft Beer
        - IPA
        - Red Wine
        - White Wine
        - Rosé Wine
        - Rose Wine
        - Sparkling Wine
        - Table Wine
        - Cooking Wine
        - Champagne
        - Prosecco
        - Sake
        - Liquor
        - Vodka
        - Whiskey
        - Whisky
        - Bourbon
        - Tequila
        - Mezcal
        - Cognac
        # Cocktail-style pre-mixed alcoholic drinks (these brand/SKU phrasings
        # in the catalog are all alcoholic):
        - Margarita
        - Mojito
        # Explicit alcohol brand names seen in the catalog.
        - Angry Orchard
        - Smirnoff Ice
        - White Claw
        - Truly Hard
        - Twisted Tea
        - Mike's Hard
        - Bud Light
        - Budweiser
        - Coors
        - Heineken
        - Corona Extra
        - Corona Light
        - Modelo
        - Guinness
        - Stella Artois

    - label: tobacco
      keywords:
        - Cigarette
        - Cigar
        - Tobacco
        - Nicotine
        - Vape
        - E-Cigarette

    - label: gift_card
      keywords:
        - Gift Card
        - Prepaid Card

    - label: pet_food
      keywords:
        - Dog Food
        - Cat Food
        - Pet Food
        - Dog Treat
        - Cat Treat
        - Cat Litter
        - Dog Chew

    - label: hot_prepared
      overrides:
        - Rotisserie Chicken Seasoning
        - Rotisserie Chicken Flavored
        - Rotisserie Chicken Flavor
      keywords:
        - Hot Bar
        - Rotisserie Chicken
        - Sushi Platter
        - Made to Order
