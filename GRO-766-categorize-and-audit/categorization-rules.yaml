# Audit exclusions — applied AFTER categorization. An excluded product keeps its
# slug (so reports can still show where it WOULD have landed) but receives
# audit_action: "exclude" and an audit_reason label so the final import step
# drops it.
#
# Keywords are case-insensitive substrings matched against `name_en`. The FIRST
# matching label wins (order matters for reporting, not for correctness — a
# product with multiple matches gets labelled by the first one in the list).
audit:
  exclude_patterns:
    - label: alcohol
      # If name_en matches ANY of these override phrases, the alcohol rule is
      # skipped for that product. This keeps clearly-non-alcoholic products
      # (Malta soda, non-alcoholic beer, vodka-pasta-sauce, beer-battered
      # onion rings, bourbon-flavored frozen dinners) out of the exclusion
      # pile. Overrides are matched as word-boundary, case-insensitive
      # substrings.
      overrides:
        - Non-Alcoholic
        - Non Alcoholic
        - Alcohol Free
        - Alcohol-Free
        - "0.0"
        # Vodka-as-flavoring (pasta sauces, etc.)
        - Vodka Sauce
        - Vodka Cream
        - Vodka Pasta
        - Vodka Arrabbiata
        - Alla Vodka
        - Sauce, Vodka
        # Bourbon-as-flavoring
        - Bourbon Chicken
        - Bourbon Glaze
        - Bourbon BBQ
        - Bourbon Hot Sauce
        - Bourbon Maple
        - Honey Bourbon
        - Whiskey Maple
        - Whiskey BBQ
        - Whiskey Glaze
        # Cooking uses
        - Beer Battered
        - Beer-Battered
        - Cooking Wine
        - Wine Vinegar
        - Wine Vinaigrette
        - Champagne Vinegar
        - Champagne Style
        - Champagne Vinaigrette
        - "Vinegar, Red Wine"
        - "Vinegar, White Wine"
        - Whiskey Flavored
        - Whiskey Flavor
        - Whiskey Seasoning
        # Non-alcoholic malt drinks (Malta soda, chocolate malt)
        - Malta Goya
        - Goya Malta
        - Chocolate Malt
        - Malted Milk
        # Flavor extracts
        - Rum Extract
        - Rum Flavor
        - Almond Extract
        # Marinades, mixers (non-alcoholic)
        - Margarita Mix
        - Mojito Mix
        - Mojito Lime Marinade
        - Mojito Marinade
        - Daiquiri Mix
        - Cocktail Sauce
        - Sauce, Margarita
        - Mixer, Strawberry Daiquiri
        - "Daiquiri/Margarita"
      keywords:
        # Only list phrases that unambiguously imply alcohol. Plain "Beer",
        # "Ale", "Cocktail" are intentionally NOT here because they produce
        # false positives against "Root Beer", "Ginger Ale", "Fruit Cocktail",
        # "Juice Cocktail", etc. Likewise "Gin" (gingerbread), "Scotch" (tape),
        # "Rum" (cake) are too risky; rely on brand matches for those.
        - Hard Cider
        - Hard Seltzer
        - Hard Lemonade
        - Malt Beverage
        - Craft Beer
        - IPA
        - Red Wine
        - White Wine
        - Rosé Wine
        - Rose Wine
        - Sparkling Wine
        - Table Wine
        - Cooking Wine
        - Champagne
        - Prosecco
        - Sake
        - Liquor
        - Vodka
        - Whiskey
        - Whisky
        - Bourbon
        - Tequila
        - Mezcal
        - Cognac
        # Cocktail-style pre-mixed alcoholic drinks (these brand/SKU phrasings
        # in the catalog are all alcoholic):
        - Margarita
        - Mojito
        # Explicit alcohol brand names seen in the catalog.
        - Angry Orchard
        - Smirnoff Ice
        - White Claw
        - Truly Hard
        - Twisted Tea
        - Mike's Hard
        - Bud Light
        - Budweiser
        - Coors
        - Heineken
        - Corona Extra
        - Corona Light
        - Modelo
        - Guinness
        - Stella Artois

    - label: frozen_dessert
      # Ice cream, frozen yogurt bars, frozen fruit bars, ice pops, Italian ice,
      # sorbet, gelato — all treated as non-staples for Groupr's SNAP-forward
      # catalog.
      #
      # Override phrases carve out NON-frozen-dessert products whose name
      # happens to contain "Ice Cream" (syrups and toppings that are MADE
      # FOR ice cream, empty cones/cups intended for ice cream, cake mix,
      # etc.) and similarly rescue phrases like "Ice Cream Cups, Jumbo"
      # (Joy's empty wafer cups) while still excluding "Haagen-Dazs Ice Cream
      # Cup" (which is a cup OF ice cream).
      overrides:
        - Ice Cream Syrup
        - Ice Cream Topping
        - Ice Cream Sprinkle
        - Ice Cream Sprinkles
        - Ice Cream Mix
        - Ice Cream Cake Cup
        - Ice Cream Cake Cups
        - Ice Cream Cake Cone
        - Ice Cream Cake Cones
        - Chocolate Syrup For Milk Or Ice Cream
        - For Milk Or Ice Cream
        - Syrup For Ice Cream
        # Coffee flavors / creamers named after ice-cream flavors:
        - Ice Cream Coffee Creamer
        # Joy-brand empty wafer cups (see brands list below for the cleaner
        # way we disambiguate those; these are extra insurance):
        - "Ice Cream Cups, Jumbo"
        - "Ice Cream Cups, Color"
      brands:
        # Brands whose ENTIRE catalog presence is frozen dessert. Brand match
        # is preferred over name-keyword match because brand names like
        # "Klondike" or "Drumstick" also appear in unrelated product names
        # ("Klondike Potatoes", "Chicken Drumsticks") and a keyword search
        # would cause false-positive exclusions.
        - haagen-dazs
        - ben & jerry's
        - halo top
        - talenti
        - outshine
        - yasso
        - good humor
        - popsicle
        - friendly's
        - drumstick
        - fatboy
        - marinos
        - rosati
        - melona
        - bomb pop
        - fla-vor-ice
        - whole fruit
        - weight watchers
        # NOTE: `klondike` is NOT listed here because the brand also sells
        # potatoes. Klondike ice-cream SKUs are caught by the "Ice Cream" /
        # "Frozen Dairy Dessert" keywords instead.
      keywords:
        - Ice Cream
        - Frozen Dessert
        - Frozen Dairy Dessert
        - Frozen Yogurt
        - Frozen Fruit Bar
        - Frozen Fruit Bars
        - Frozen Juice Bar
        - Ice Pop
        - Ice Pops
        - Freezer Bar
        - Freezer Bars
        - Freeze Pop
        - Italian Ice
        - Sorbet
        - Sorbetto
        - Gelato
        - Dessert Bar
        - Dessert Bars

    - label: baby_food
      # Baby food, infant cereal, infant formula, and toddler purees. Groupr's
      # catalog targets adult household shoppers; baby-aisle SKUs are handled
      # through separate infant-nutrition channels.
      #
      # Brands that exclusively ship baby/toddler SKUs are matched on the
      # product's `brand` field (safer than a name-keyword because a brand
      # token like "Gerber" or "Similac" inside a non-baby SKU name would
